spring:
  application:
    name: global-payment-service

  datasource:
    url: jdbc:h2:mem:payment-service;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173

exchangerate:
  base-url: http://localhost:${server.port}
  max-attempts: 3
  initial-backoff-ms: 200
  connect-timeout-ms: 500
  read-timeout-ms: 1000

mock:
  exchange-rate:
    error-rate: 0.3
    min-delay-ms: 100
    max-delay-ms: 900

logging:
  file:
    name: logs/global-payment-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 100MB
